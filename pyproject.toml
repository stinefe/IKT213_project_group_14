[project]
name = "falldet"
version = "0.1.0"
description = "Fall detection from video (IKT213 group 14)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "tqdm>=4.70.1",
    "ultralytics>=8.4.123",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["falldet"]